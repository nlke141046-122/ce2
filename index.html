<html lang="th">
<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--ink:#141414;--muted:#6d6a64;--line:#e4e1da;--bg:#f5f3ef;--card:#fff;
--green:#12804a;--green2:#e6f4ec;--red:#c4302a;--red2:#fcebea;--amber:#a86a12;--amber2:#fcf3e2;--blue:#1d5bb8;--blue2:#e8f0fb}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e7e4de;font-family:'Sarabun','Noto Sans Myanmar',system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.my{font-family:'Noto Sans Myanmar','Sarabun',system-ui,sans-serif;line-height:1.75;font-size:17px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.phone{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px;box-shadow:0 0 40px rgba(0,0,0,.08)}
/* demo bar */
#demo{max-width:460px;margin:0 auto;background:#222;color:#eee;font-size:13px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#demo b{color:#ffd56b}
#demo button{background:#444;color:#fff;border:0;border-radius:8px;padding:4px 10px;font-size:13px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{height:30px}
.langs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:15px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--ink);color:#fff}
/* generic */
.pad{padding:0 16px}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 16px;border:1px solid var(--line)}
h1{font-size:26px;margin:0 0 4px;font-weight:800}
h2{font-size:21px;margin:0 0 10px;font-weight:800}
h3{font-size:18px;margin:0 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:15px}
.center{text-align:center}
label.f{display:block;font-weight:700;margin:14px 0 6px;font-size:17px}
input.in,select.in,textarea.in{font-size:21px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;width:100%;background:#fff;color:var(--ink)}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--ink)}
textarea.in{font-size:18px;min-height:80px}
.otp{letter-spacing:12px;text-align:center;font-size:32px!important;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:21px;font-weight:800;background:var(--ink);color:#fff;margin-top:16px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.b{background:var(--blue)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sbtn{border:0;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;background:var(--bg);color:var(--ink)}
.sbtn.g{background:var(--green);color:#fff}.sbtn.r{background:var(--red);color:#fff}.sbtn.b{background:var(--blue);color:#fff}.sbtn.o{background:#fff;border:2px solid var(--line)}
/* big clock button */
.hello{padding:18px 16px 4px}
.clock{font-size:54px;font-weight:800;text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums;margin-top:6px}
.date{text-align:center;color:var(--muted);font-size:18px}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:230px;height:230px;margin:22px auto 8px;border-radius:50%;border:0;color:#fff;font-size:36px;font-weight:800;box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.12);transition:transform .08s}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bigbtn .ic{font-size:58px;line-height:1;margin-bottom:6px}
.bigbtn.in{background:var(--green)}.bigbtn.out{background:var(--red)}
.hint{text-align:center;color:var(--muted);font-size:16px;padding:0 24px}
.status2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border-radius:14px;padding:12px;background:var(--bg)}
.st .k{font-size:15px;color:var(--muted)}
.st .v{font-size:26px;font-weight:800}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.p-g{background:var(--green2);color:var(--green)}.p-r{background:var(--red2);color:var(--red)}.p-a{background:var(--amber2);color:var(--amber)}.p-b{background:var(--blue2);color:var(--blue)}.p-n{background:#eee;color:#555}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
a.map{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
/* leave types */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font-size:18px;font-weight:700}
.types button .e{display:block;font-size:34px}
.types button.on{border-color:var(--ink);background:var(--ink);color:#fff}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .k{font-size:15px;color:var(--muted)}
.tile .v{font-size:32px;font-weight:800;line-height:1.1}
.tile .u{font-size:15px;color:var(--muted);font-weight:600}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 0}
.monthnav button{border:0;background:#fff;border:1px solid var(--line);border-radius:12px;width:48px;height:44px;font-size:22px}
.monthnav .m{font-size:21px;font-weight:800}
/* bottom nav */
nav.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.bn button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:700;position:relative}
nav.bn button .e{font-size:26px;line-height:1.2}
nav.bn button.on{color:var(--ink);background:var(--bg)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--red);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;padding:0 5px}
/* admin */
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;position:relative}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg .badge{position:static;display:inline-block;margin-left:4px}
.emp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.emp:first-child{border-top:0}
.av{flex:0 0 42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.emp .nm{font-weight:700}
.emp .meta{font-size:15px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts .sbtn{padding:7px 11px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font-size:13px;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.ts{font-size:13px;color:var(--muted);text-align:right;margin:8px 16px 0}
/* modal & toast */
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal .box{background:#fff;border-radius:22px;padding:24px 20px 18px;max-width:400px;width:100%;text-align:center;max-height:90vh;overflow:auto}
#modal .box.form{text-align:left}
#modal .ico{font-size:60px;line-height:1}
#modal .box.err{border-top:8px solid var(--red)}
#modal .box.ok{border-top:8px solid var(--green)}
#modal h2{margin-top:8px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60}
#toast div{background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.splash{padding:40px 22px 10px;text-align:center}
.splash img{width:230px;max-width:70%;margin:10px auto 18px;display:block}
.chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 9px;margin:3px;font-size:14px;cursor:pointer}

.phone{padding-top:env(safe-area-inset-top)}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.loadbox{padding:30px;text-align:center;color:var(--muted)}
.code{font-size:56px;font-weight:800;letter-spacing:8px;font-variant-numeric:tabular-nums}
.stack .btn{margin-top:10px}
.install{background:#fff8e6;border:1px solid #f1d58a}
.refresh{border:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px;margin-left:6px}
</style>
</head>

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function genId(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}
  const a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<16;i++)a[i]=Math.floor(Math.random()*256)}
  let s='';a.forEach(b=>s+=('0'+b.toString(16)).slice(-2));
  return s.slice(0,8)+'-'+s.slice(8,12)+'-'+s.slice(12,16)+'-'+s.slice(16,20)+'-'+s.slice(20);
}

const digits=s=>String(s||'').replace(/\D/g,'');

const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=String(s).slice(0,10).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};

function t(k,v){let s=(T[st.lang]&&T[st.lang][k]!=null)?T[st.lang][k]:(T.th[k]!=null?T.th[k]:k);if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s}
function fmtDate(d,opt){try{return d.toLocaleDateString(LOCALE[st.lang],opt||{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return ymd(d)}}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);try{return new Date(y,mo-1,1).toLocaleDateString(LOCALE[st.lang],{month:'long',year:'numeric'})}catch(e){return m}}
function shiftMonth(m,d){let [y,mo]=m.split('-').map(Number);mo+=d;if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}return y+'-'+pad(mo)}
function sd(s,opt){return s?fmtDate(parseYmd(s),opt||{day:'numeric',month:'short'}):''}
function daysInMonth(l,m){let n=0;for(let d=parseYmd(l.from),i=0;ymd(d)<=l.to&&i<400;d=addDays(d,1),i++){if(d.getDay()!==0&&ymd(d).slice(0,7)===m)n++}return n}
function stats(logs,leaves,advances,empId,m){
  logs=(logs||[]).filter(l=>l.empId===empId&&l.date.slice(0,7)===m).sort((a,b)=>a.date<b.date?-1:1);
  const lv={sick:0,personal:0,vacation:0,other:0};
  (leaves||[]).filter(l=>l.empId===empId&&l.status==='approved').forEach(l=>lv[l.type]=(lv[l.type]||0)+daysInMonth(l,m));
  const adv=(advances||[]).filter(a=>a.empId===empId&&String(a.created).slice(0,7)===m).reduce((s,a)=>s+Number(a.amount||0),0);
  return{logs,work:logs.length,late:logs.filter(l=>l.late).length,hours:logs.reduce((s,l)=>s+Number(l.hours||0),0),lv,leave:lv.sick+lv.personal+lv.vacation+lv.other,adv};
}

const st={lang:lsGet(KL)||'th',view:'loading',tab:'time',atab:'live',me:null,settings:{start:'08:30',end:'17:30',grace:5,emails:''},today:null,pendingCount:0,

/* ===================== API ===================== */
async function api(action,data){
  if(!/^https:\/\//.test(API_URL))throw{error:'NO_CONFIG'};
  let r,j;
  try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,deviceId:DEVICE},data||{})),redirect:'follow'})}catch(e){throw{error:'NET'}}
  try{j=await r.json()}catch(e){throw{error:'NET'}}
  if(!j||!j.ok)throw(j||{error:'NET'});
  return j;
}
function applyMe(j){
  st.me=j.me;if(j.settings)st.settings=j.settings;st.today=j.today||null;st.pendingCount=j.pendingCount||0;
  st.view=j.me.devStatus==='approved'?'home':'pending';
}
function handleErr(e){
  const c=(e&&e.error)||'NET';closeModal();
  switch(c){
    case 'NET':return err(t('errNet'),'');
    case 'NO_CONFIG':st.view='fatal';st.fatal=t('noConfig');return render();
    case 'NOT_SETUP':st.view='fatal';st.fatal=t('notSetup');return render();
    case 'BAD_PHONE':return err(t('errPhone'),'');
    case 'NOT_FOUND':return err(st.view==='login'?t('errNotFound'):t('errGeneric'),'');
    case 'RESIGNED':st.view='login';st.me=null;render();return err(t('errResigned'),'');
    case 'DEVICE_TAKEN':return modal({icon:'🚫',kind:'err',title:t('errBuddyT'),body:`<p style="font-size:19px">${t('errBuddy',{name:esc(e.name)})}</p><p class="muted small">ERROR: DEVICE_ALREADY_BOUND · ${devCode()}</p>`});
    case 'PHONE_OTHER_DEVICE':return modal({icon:'📵',kind:'err',title:t('errOtherT'),body:`<p>${t('errOther')}</p><p class="muted small">ERROR: PHONE_BOUND_TO_OTHER_DEVICE</p>`});
    case 'NOT_REGISTERED':st.view='login';st.me=null;render();return err(t('errKicked'),'');
    case 'DEVICE_PENDING':st.view='pending';return render();
    case 'ALREADY_IN':case 'ALREADY_OUT':refreshMe();return err(t('errAlready'),'');
    case 'DUPLICATE':return err(t('errDup'),'');
    case 'REQUIRED':return err(t('errReq'),'');
    case 'BAD_DATE':return err(t('errDate'),'');
    case 'BAD_TYPE':return err(t('errType'),'');
    case 'BAD_ADVANCE':return err(t('errAdv'),'');
    default:return err(t('errGeneric'),'<p class="muted small">'+esc(c)+(e&&e.message?' · '+esc(e.message):'')+'</p>');
  }
}
async function refreshMe(){try{applyMe(await api('me'));render()}catch(e){handleErr(e)}}
async function boot(){
  st.view='loading';render();
  if(!/^https:\/\//.test(API_URL)){st.view='fatal';st.fatal=t('noConfig');return render()}
  try{applyMe(await api('me'))}
  catch(e){
    if(e&&e.error==='NOT_REGISTERED'){st.view='login'}
    else if(e&&e.error==='RESIGNED'){st.view='login';render();return err(t('errResigned'),'')}
    else if(e&&e.error==='NOT_SETUP'){st.view='fatal';st.fatal=t('notSetup')}
    else{st.view='fatal';st.fatal=t('errNet')}
  }
  render();
}

/* ===================== UI PRIMITIVES ===================== */
function toast(msg){const el=document.getElementById('toast');el.innerHTML='<div>'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>el.innerHTML='',2400)}
let modalBtns=[];
function modal(o){
  const icon=o.icon||'',title=o.title||'',body=o.body||'',kind=o.kind||'';
  modalBtns=o.buttons||[{label:t('ok'),fn:closeModal}];
  const stack=o.stack||modalBtns.length>2;
  document.getElementById('modal').innerHTML=`<div class="bg"><div class="box ${kind} ${o.form?'form':''}">${icon?`<div class="ico">${icon}</div>`:''}${title?`<h2>${title}</h2>`:''}<div>${body}</div>${modalBtns.length?`<div class="${stack?'stack':(modalBtns.length>1?'row':'')}">${modalBtns.map((b,i)=>`<button class="btn ${b.cls||''}" onclick="modalBtns[${i}].fn()">${b.label}</button>`).join('')}</div>`:'<div class="spin"></div>'}</div></div>`;
}
function closeModal(){document.getElementById('modal').innerHTML=''}
function modalOpen(){return !!document.getElementById('modal').innerHTML}
function err(title,body){modal({icon:'⛔',title:title,body:body,kind:'err'})}
function confirmBox(msg,fn,cls){modal({icon:'❓',title:msg,buttons:[{label:t('cancel'),cls:'ghost',fn:closeModal},{label:t('confirm'),cls:cls||'r',fn:()=>{closeModal();fn()}}]})}
function busy(title){modal({icon:'⏳',title:title||t('saving'),buttons:[]})}
async function act(action,data,okMsg,after){
  busy();
  try{const j=await api(action,data);closeModal();if(okMsg)toast(okMsg);if(after)after(j);render();return j}
  catch(e){handleErr(e)}
}
const loadingBox=()=>`<div class="loadbox"><div class="spin"></div>${t('loading')}</div>`;

function load(key,fn){

function ensureLive(force){if(force||!st.live)load('live',async()=>{st.live=await api('adminLive');st.pendingCount=st.live.pendingCount})}
function ensurePend(force){if(force||!st.pend)load('pend',async()=>{st.pend=await api('adminPending');st.pendingCount=st.pend.registrations.length+st.pend.leaves.length+st.pend.advances.length})}
function ensureEmps(force){if(force||!st.emps)load('emps',async()=>{st.emps=(await api('adminEmployees')).employees})}

async function goNext(){

  busy(t('loading'));
  try{const j=await api('register',{phone:p});closeModal();applyMe(j);render();if(st.view==='home')toast(t('welcome')+' '+j.me.name)}
  catch(e){handleErr(e)}
}
function logout(){st.view='login';st.me=null;render()}
function getLoc(){
  return new Promise(res=>{
    try{
      if(!navigator.geolocation)return res(null);
      let done=false;const tm=setTimeout(()=>{if(!done){done=true;res(null)}},16000);
      navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tm);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)})},
        ()=>{if(done)return;done=true;clearTimeout(tm);res(null)},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
    }catch(e){res(null)}
  });
}
function punch(kind){
  if(st.busy)return;
  const send=async loc=>{
    st.busy=true;busy();
    try{
      const j=await api('clock',Object.assign({kind:kind},loc||{}));
      st.busy=false;applyMe(j);delete st.my[curMonth()];st.live=null;
      const l=j.today||{},time=kind==='in'?l.in:l.out,loc2=kind==='in'?l.inLoc:l.outLoc,map=kind==='in'?l.inMap:l.outMap;
      modal({icon:'✅',kind:'ok',title:kind==='in'?t('savedIn'):t('savedOut'),
        body:`<div style="font-size:52px;font-weight:800">${esc(time)}</div>${kind==='in'?`<span class="pill ${l.late?'p-r':'p-g'}">${l.late?t('late'):t('onTime')}</span>`:''}<p class="small muted">📍 ${map?esc(loc2):t('noLoc')}${map?`<br><a class="map" href="${esc(map)}" target="_blank" rel="noopener">${t('map')}</a>`:''}</p>`,
        buttons:[{label:t('ok'),cls:'g',fn:()=>{closeModal();render()}}]});
    }catch(e){st.busy=false;handleErr(e)}
  };
  const withLoc=async()=>{
    modal({icon:'📍',title:t('locating'),buttons:[]});
    const loc=await getLoc();
    if(loc)return send(loc);
    modal({icon:'📍',kind:'err',title:t('errLocT'),body:`<p>${t('errLoc')}</p>`,stack:true,buttons:[{label:'🔄 '+t('retry'),cls:'g',fn:withLoc},{label:t('noLocSave'),cls:'ghost',fn:()=>send(null)},{label:t('cancel'),cls:'ghost',fn:closeModal}]});
  };
  if(kind==='out')confirmBox(t('confirmOut'),withLoc,'r');else withLoc();
}

const TYPE_TH={sick:'ลาป่วย',personal:'ลากิจ',vacation:'ลาพักร้อน',other:'ลาอื่นๆ'};
const LST_TH={pending:'รออนุมัติ',approved:'อนุญาต',rejected:'ไม่อนุญาต'};
const AST_TH={requested:'รอโอน',transferred:'โอนแล้ว',received:'ได้รับแล้ว',notReceived:'ยังไม่ได้รับ'};
const LOGH=['วันที่','รหัส','ชื่อ','เวลาเข้า','สถานะ','พิกัดเข้า','แผนที่เข้า','เวลาออก','พิกัดออก','แผนที่ออก','ชั่วโมง'];
const LOGW=[12,7,26,9,9,20,42,9,20,42,8];
function logRow(l){return[l.date,l.empId,l.name,l.in,l.late?'สาย':'ตรงเวลา',l.inLoc,l.inMap,l.out||'',l.outLoc||'',l.outMap||'',Number(l.hours||0)]}
function sheet(rows,w){const ws=XLSX.utils.aoa_to_sheet(rows);if(w)ws['!cols']=w.map(x=>({wch:x}));return ws}
function saveBook(wb,filename){
  if(typeof XLSX==='undefined')return err(t('dlNo'),'');
  try{
    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast(t('dlOk'));
  }catch(e){err(t('dlNo'),'')}
}
function exportMine(){
  const m=st.sumMonth,d=st.my[m];if(!d)return;const e=st.me,s=stats(d.logs,d.leaves,d.advances,e.id,m);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheet([['สรุปประจำเดือน',m],['รหัส',e.id],['ชื่อ',e.name],['ตำแหน่ง',e.position],[],['วันทำงาน',s.work],['วันมาสาย',s.late],['ลาป่วย',s.lv.sick],['ลากิจ',s.lv.personal],['ลาพักร้อน',s.lv.vacation],['ลาอื่นๆ',s.lv.other],['รวมวันลา',s.leave],['ชั่วโมงรวม',+s.hours.toFixed(2)],['ยอดเบิกเงิน (บาท)',s.adv]],[20,30]),'สรุป');
  XLSX.utils.book_append_sheet(wb,sheet([LOGH].concat(s.logs.map(logRow)),LOGW),'บันทึกเวลา');
  saveBook(wb,'CE2_'+e.id+'_'+m+'.xlsx');

  const rows=d.employees.map(e=>{const l=d.logs.find(x=>x.empId===e.id),lv=d.leaves.find(x=>x.empId===e.id);
    let s,p;if(l&&l.out){s='left';p='p-n'}else if(l){s='working';p='p-g'}else if(lv){s='onLeave';p='p-b'}else{s='absent';p='p-a'}return{e,l,s,p}});

  const order={working:0,left:1,onLeave:2,absent:3};rows.sort((a,b)=>order[a.s]-order[b.s]||String(a.e.id).localeCompare(b.e.id));

   <div class="tile"><div class="k">${t('working')}</div><div class="v" style="color:var(--green)">${c('working')}</div></div>
   <div class="tile"><div class="k">${t('left')}</div><div class="v">${c('left')}</div></div>

  <div class="card">${rows.map(({e,l,s,p})=>`<div class="emp"><div class="av">${esc(initials(e.name))}</div><div style="flex:1;min-width:0"><div class="row" style="align-items:center"><div class="nm">${esc(e.name)}</div><div style="text-align:right;flex:0 0 auto"><span class="pill ${p}">${t(s)}</span></div></div>

/* ===================== RENDER ===================== */
function render(){
  document.body.classList.toggle('my',st.lang==='my');document.documentElement.lang=st.lang;
  let h;
  if(st.view==='loading')h=vLoading();
  else if(st.view==='fatal')h=vFatal();
  else if(st.view==='login')h=vLogin();
  else if(st.view==='pending')h=vPending();
  else{const e=st.me;if(st.tab==='admin'&&!e.isAdmin)st.tab='time';
    h=header()+({time:vTime,leave:vLeave,adv:vAdv,sum:vSum,admin:vAdmin}[st.tab])(e)+navBar();}
  // keep typed values in forms across re-render
  const keep={};['ph','an','aa','lr','lf','lt'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  document.getElementById('app').innerHTML=h;
  Object.keys(keep).forEach(id=>{const el=document.getElementById(id);if(el&&keep[id]!=='')el.value=keep[id]});
}
setInterval(()=>{const c=document.getElementById('clk');if(c){const n=new Date();c.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds())}},1000);
// real-time: admin live view refreshes every 20s; pending screen re-checks every 20s
setInterval(()=>{
  if(document.hidden||modalOpen())return;
  if(st.view==='home'&&st.tab==='admin'&&st.atab==='live')ensureLive(true);
  else if(st.view==='pending')api('me').then(j=>{applyMe(j);render()}).catch(()=>{});
},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.view==='home'&&!modalOpen()){api('me').then(j=>{applyMe(j);render()}).catch(()=>{})}});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
boot();
</script>
</body>
